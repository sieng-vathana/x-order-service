spring:
  config:
    activate:
      on-profile: production
    import: optional:file:../config/secrets.yml
  datasource:
    url: jdbc:mysql://${db.host}:${db.port}/${db.prod.name}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${db.prod.username}
    password: ${db.prod.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:x-kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: x-order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.x.order.event"

services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://x-product-service:8080}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://x-inventory-service:8080}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://x-payment-service:8080}
  delivery:
    base-url: ${DELIVERY_SERVICE_URL:http://x-delivery-service:8080}
